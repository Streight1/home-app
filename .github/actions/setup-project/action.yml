name: Setup HomeApp project
description: Install the pinned Node and pnpm toolchain and optionally generate Prisma artifacts.

inputs:
  generate-prisma:
    description: Generate and verify the Prisma Client after dependency installation.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up pinned Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: .nvmrc

    - name: Activate the repository pnpm version
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: |
        set -euo pipefail
        npm install --global corepack@0.34.0
        corepack enable
        package_manager="$(node --input-type=module -e "import packageJson from './package.json' with { type: 'json' }; process.stdout.write(packageJson.packageManager)")"
        corepack prepare "${package_manager}" --activate
        expected_version="${package_manager#pnpm@}"
        actual_version="$(pnpm --version)"
        test "${actual_version}" = "${expected_version}"
        node --version
        pnpm --version

    - name: Install locked dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Generate and verify Prisma artifacts
      if: inputs.generate-prisma == 'true'
      shell: bash
      run: pnpm ci:generate
